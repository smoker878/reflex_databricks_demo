[project]
name = "reflex-databricks-demo"
version = "0.1.0"
description = ""
license = { text = "MIT" }
requires-python = ">=3.11,<3.12"
dependencies = [
    "reflex==0.8.24.post1",
    "reflex-local-auth>=0.5.0,<0.6.0",
    "sqlmodel>=0.0.48,<0.1.0",
    "databricks-sql-connector>=4.6.0,<5.0.0",
    "databricks-sdk>=0.151.0,<0.152.0",
    "python-dotenv>=1.2.4,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "playwright>=1.42.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reflex_databricks_demo"]
